packages:
  - "apps/*"
  - "apps/agent-host/examples/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': false
  msgpackr-extract: false
  tree-sitter-bash: false
  tree-sitter-powershell: false
  '@google/genai': false
  '@mongodb-js/zstd': false
  core-js-pure: false
  node-liblzma: false
  protobufjs: false
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true
  lefthook: true
minimumReleaseAgeExclude:
  - '@cloudflare/vite-plugin@1.62.5'
  - miniflare@5.20261001.0-alpha
  - wrangler@4.147.0
  - '@cloudflare/computer@0.4.0'
  - agents@0.30.0
  - '@earendil-works/chord@1.4.0'
  - '@earendil-works/pi-ai@1.4.0'
  - '@earendil-works/pi-durable@1.4.0'
catalog:
  '@opencode/sdk': 2.0.24
  '@opencode/plugin': 2.0.24
  '@agentclientprotocol/sdk': 1.7.0
  '@earendil-works/chord': 1.4.0
  '@earendil-works/pi-ai': 1.4.0
  '@earendil-works/pi-durable': 1.4.0
  '@cloudflare/computer': 0.4.0
  zod: 4.6.5
  agents: 0.30.0
  '@microsoft/agent-host-protocol': 0.9.0
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
