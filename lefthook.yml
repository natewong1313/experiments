# Format and lint staged files on commit.
# Each oxlint command lists its workspace's staged files via `files` and runs
# with the same flags as that workspace's own `lint` script. Docs:
# https://lefthook.dev
pre-commit:
  commands:
    # Lint configs must be oxlint.config.ts (TypeScript). This guards against
    # reintroducing the legacy .oxlintrc.json format.
    no-oxlintrc-json:
      run: |
        if git diff --cached --name-only --diff-filter=ACMR | grep -E '(^|/)\.?oxlintrc\.json(c)?$'; then
          echo "ERROR: oxlintrc JSON configs are banned; use oxlint.config.ts instead (files listed above)." >&2
          exit 1
        fi

    oxfmt:
      glob: "*.{ts,tsx,md}"
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true

    oxlint-agent-host:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}"
      files: git diff --cached --name-only --diff-filter=ACMR -- apps/agent-host/src apps/agent-host/test apps/agent-host/vitest.config.ts apps/agent-host/drizzle.config.ts
      run: pnpm exec oxlint --deny-warnings --no-error-on-unmatched-pattern --type-aware {files}

    oxlint-agent-host-basic:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}"
      files: git diff --cached --name-only --diff-filter=ACMR -- apps/agent-host/examples/basic/src apps/agent-host/examples/basic/client
      run: pnpm exec oxlint --deny-warnings --no-error-on-unmatched-pattern --type-aware {files}

    oxlint-agent-host-multi-agent:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}"
      files: git diff --cached --name-only --diff-filter=ACMR -- apps/agent-host/examples/multi-agent/src apps/agent-host/examples/multi-agent/client
      run: pnpm exec oxlint --deny-warnings --no-error-on-unmatched-pattern --type-aware {files}

    oxlint-agent-host-web:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}"
      files: git diff --cached --name-only --diff-filter=ACMR -- apps/agent-host/examples/web/src apps/agent-host/examples/web/vite.config.ts
      run: pnpm exec oxlint --deny-warnings --no-error-on-unmatched-pattern --type-aware {files}

    oxlint-harness-acp:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}"
      files: git diff --cached --name-only --diff-filter=ACMR -- apps/harness-acp/src apps/harness-acp/test apps/harness-acp/vitest.config.ts
      run: pnpm exec oxlint --deny-warnings --no-error-on-unmatched-pattern --type-aware {files}

    oxlint-protocol-schemas:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}"
      files: git diff --cached --name-only --diff-filter=ACMR -- packages/protocol-schemas
      run: pnpm exec oxlint --deny-warnings --no-error-on-unmatched-pattern {files}

    oxlint-scripts:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}"
      files: git diff --cached --name-only --diff-filter=ACMR -- packages/scripts
      run: pnpm exec oxlint --deny-warnings --no-error-on-unmatched-pattern --type-aware {files}

    oxlint-ahp-conformance:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}"
      files: git diff --cached --name-only --diff-filter=ACMR -- packages/ahp-conformance
      run: pnpm exec oxlint --deny-warnings --no-error-on-unmatched-pattern {files}
